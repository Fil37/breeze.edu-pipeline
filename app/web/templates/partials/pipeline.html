{# The agents of a run, in pipeline order, small (a card). Expects `agents`: [{agent, name, status}]. #}
<ol class="pipeline">
  {% for a in agents %}
  <li class="agent {{ a.status | badge }}" title="{{ a.agent }} · {{ a.status | status }}">
    <span class="dot" aria-hidden="true"></span><span>{{ a.name }}</span>
  </li>
  {% endfor %}
</ol>
