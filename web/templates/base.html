<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}breeze{% endblock %} · breeze</title>
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/breeze_master.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="logo" aria-hidden="true"></span>breeze <span class="brand-sub">studio</span></a>
    <nav>
      <a href="/" {% if active == "dashboard" %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="/standup" {% if active == "standup" %}aria-current="page"{% endif %}>Standup</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">breeze · read-only: this interface starts nothing and changes no file.</footer>
  <script src="{{ url_for('static', filename='js/breeze.js') }}" defer></script>
</body>
</html>
